<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>喜迎新春特惠商城 - 迎春納福賀新年</title>
    <!-- 引入 Google Fonts 與 FontAwesome 圖示 -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;900&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary-red: #d32f2f;
            --dark-red: #8b0000;
            --gold: #ffd700;
            --light-gold: #fff3cd;
            --bg-color: #fff9f0;
            --text-color: #333333;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', 'Noto Serif TC', serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow-x: hidden;
            position: relative;
        }

        /* 頂部新年橫幅 */
        header {
            background: linear-gradient(135deg, var(--dark-red), var(--primary-red));
            color: white;
            padding: 1.5rem 2rem;
            box-shadow: 0 4px 15px rgba(139, 0, 0, 0.3);
            position: sticky;
            top: 0;
            z-index: 1000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 4px solid var(--gold);
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo-area i {
            font-size: 2.2rem;
            color: var(--gold);
            animation: pulse 2s infinite;
        }

        .logo-area h1 {
            font-size: 1.8rem;
            color: var(--gold);
            font-weight: 900;
            letter-spacing: 2px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        /* 購物車按鈕與酷炫動效 */
        .cart-btn {
            background: linear-gradient(135deg, #ffc107, #ff9800);
            color: #8b0000;
            border: 2px solid white;
            padding: 0.6rem 1.2rem;
            border-radius: 50px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 10px rgba(255, 193, 7, 0.4);
            transition: all 0.3s ease;
            position: relative;
        }

        .cart-btn:hover {
            transform: scale(1.08);
            box-shadow: 0 6px 15px rgba(255, 215, 0, 0.8);
        }

        .cart-count {
            background-color: var(--dark-red);
            color: white;
            border-radius: 50%;
            padding: 2px 8px;
            font-size: 0.85rem;
        }

        /* 主視覺 Banner */
        .hero {
            text-align: center;
            padding: 3rem 1rem;
            background: radial-gradient(circle, #ffebee 0%, #fff9f0 80%);
            border-bottom: 2px dashed #ffb74d;
        }

        .hero h2 {
            font-size: 2.5rem;
            color: var(--dark-red);
            margin-bottom: 0.5rem;
            font-weight: 900;
        }

        .hero p {
            color: #d84315;
            font-size: 1.1rem;
            letter-spacing: 1px;
        }

        /* 商品列表區域 */
        .container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 2rem;
        }

        .product-card {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 6px 20px rgba(0,0,0,0.06);
            border: 2px solid #ffe0b2;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .product-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 12px 30px rgba(211, 47, 47, 0.15);
            border-color: var(--gold);
        }

        .product-img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            background-color: #fff3e0;
        }

        .product-info {
            padding: 1.2rem;
            text-align: center;
        }

        .product-title {
            font-size: 1.2rem;
            font-weight: 700;
            color: #4e342e;
            margin-bottom: 0.5rem;
        }

        .product-price {
            color: var(--primary-red);
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 1rem;
        }

        .buy-btn {
            width: 100%;
            background: linear-gradient(135deg, var(--primary-red), var(--dark-red));
            color: white;
            border: none;
            padding: 0.8rem;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .buy-btn:hover {
            background: linear-gradient(135deg, #e53935, #c62828);
        }

        /* 購物車抽屜側邊欄 */
        .cart-drawer {
            position: fixed;
            top: 0;
            right: -400px;
            width: 380px;
            height: 100%;
            background: white;
            box-shadow: -5px 0 25px rgba(0,0,0,0.2);
            z-index: 2000;
            transition: right 0.4s cubic-bezier(0.1, 1, 0.1, 1);
            display: flex;
            flex-direction: column;
            border-left: 5px solid var(--gold);
        }

        .cart-drawer.open {
            right: 0;
        }

        .cart-header {
            background: var(--dark-red);
            color: var(--gold);
            padding: 1.2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 1.2rem;
            font-weight: 700;
        }

        .close-cart {
            background: none;
            border: none;
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
        }

        .cart-items {
            flex: 1;
            overflow-y: auto;
            padding: 1rem;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.8rem 0;
            border-bottom: 1px solid #eee;
        }

        .cart-item-info h4 {
            font-size: 0.95rem;
            color: #333;
        }

        .cart-item-info p {
            color: var(--primary-red);
            font-size: 0.9rem;
            font-weight: 600;
        }

        .remove-btn {
            background: #ffcdd2;
            color: #c62828;
            border: none;
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8rem;
        }

        .cart-footer {
            padding: 1.2rem;
            background: #fff9f0;
            border-top: 1px solid #ffe0b2;
        }

        .total-price {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 1rem;
            display: flex;
            justify-content: space-between;
        }

        .checkout-btn {
            width: 100%;
            background: linear-gradient(135deg, #ffc107, #ff8f00);
            color: var(--dark-red);
            border: none;
            padding: 0.9rem;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 900;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(255, 152, 0, 0.4);
            transition: all 0.3s;
        }

        .checkout-btn:hover {
            transform: scale(1.03);
            background: linear-gradient(135deg, #ffd54f, #ffb300);
        }

        /* 遮罩背景 */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1500;
            display: none;
        }

        .overlay.active {
            display: block;
        }

        /* 新年酷炫慶祝特效動畫 (金幣與紅包雨) */
        .fx-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 3000;
            overflow: hidden;
            display: none;
        }

        .falling-item {
            position: absolute;
            top: -50px;
            font-size: 2rem;
            animation: fall linear forwards;
        }

        @keyframes fall {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(105vh) rotate(360deg);
                opacity: 0.2;
            }
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.15); }
            100% { transform: scale(1); }
        }

        /* 提示通知 Banner */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--dark-red);
            color: var(--gold);
            padding: 12px 25px;
            border-radius: 30px;
            border: 2px solid var(--gold);
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
            font-weight: 700;
            z-index: 4000;
            transition: transform 0.4s ease;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>
<body>

    <!-- 頂部導航 -->
    <header>
        <div class="logo-area">
            <i class="fa-solid fa-红包"></i> <!-- 若字型不支援可以換 lantern -->
            <i class="fa-solid fa-firecracker"></i>
            <h1>迎春納福賀新年商城</h1>
        </div>
        <button class="cart-btn" onclick="toggleCart()">
            <i class="fa-solid fa-cart-shopping"></i> 購物車
            <span class="cart-count" id="cartCount">0</span>
        </button>
    </header>

    <!-- 主視覺 Banner -->
    <div class="hero">
        <h2>🏮 恭喜發財．新春特惠 🏮</h2>
        <p>全館限時特惠，下單即享新春開運紅包與金幣特效大放送！</p>
    </div>

    <!-- 商品列表 -->
    <div class="container">
        <div class="product-grid" id="productGrid">
            <!-- 商品將由 JavaScript 動態帶入 -->
        </div>
    </div>

    <!-- 購物車抽屜側邊欄 -->
    <div class="overlay" id="overlay" onclick="toggleCart()"></div>
    <div class="cart-drawer" id="cartDrawer">
        <div class="cart-header">
            <span><i class="fa-solid fa-bag-shopping"></i> 您的新春購物車</span>
            <button class="close-cart" onclick="toggleCart()">&times;</button>
        </div>
        <div class="cart-items" id="cartItems">
            <!-- 購物車內容 -->
            <p style="text-align:center; color:#999; margin-top: 2rem;">購物車目前空空如也，快去挑選年貨吧！</p>
        </div>
        <div class="cart-footer">
            <div class="total-price">
                <span>總計金額：</span>
                <span id="totalPrice" style="color: var(--primary-red);">NT$ 0</span>
            </div>
            <button class="checkout-btn" onclick="checkout()">
                <i class="fa-solid fa-gift"></i> 喜慶結帳 (點擊看特效)
            </button>
        </div>
    </div>

    <!-- 新年特效容器 -->
    <div class="fx-container" id="fxContainer"></div>

    <!-- 提示框 -->
    <div class="toast" id="toast">已成功加入購物車！</div>

    <script>
        // 商品資料
        const products = [
            { id: 1, name: "富貴吉祥開運年菜組", price: 2888, img: "https://images.unsplash.com/photo-1555396273-367ea4eb4db5?auto=format&fit=crop&w=500&q=80" },
            { id: 2, name: "鴻運當頭特級烏魚子禮盒", price: 1688, img: "https://images.unsplash.com/photo-1541592106381-b31e9677c0e5?auto=format&fit=crop&w=500&q=80" },
            { id: 3, name: "步步高昇手工干貝蘿蔔糕", price: 588, img: "https://images.unsplash.com/photo-1563245372-f21724e3856d?auto=format&fit=crop&w=500&q=80" },
            { id: 4, name: "迎春納福金箔高山茶禮盒", price: 1280, img: "https://images.unsplash.com/photo-1576092768241-dec231879fc3?auto=format&fit=crop&w=500&q=80" }
        ];

        let cart = [];

        // 初始化商品列表
        function renderProducts() {
            const grid = document.getElementById('productGrid');
            grid.innerHTML = products.map(p => `
                <div class="product-card">
                    <img src="${p.img}" alt="${p.name}" class="product-img">
                    <div class="product-info">
                        <h3 class="product-title">${p.name}</h3>
                        <div class="product-price">NT$ ${p.price.toLocaleString()}</div>
                        <button class="buy-btn" onclick="addToCart(${p.id})">
                            <i class="fa-solid fa-cart-plus"></i> 加入購物車
                        </button>
                    </div>
                </div>
            `).join('');
        }

        // 切換購物車抽屜顯示
        function toggleCart() {
            const drawer = document.getElementById('cartDrawer');
            const overlay = document.getElementById('overlay');
            drawer.classList.toggle('open');
            overlay.classList.toggle('active');
        }

        // 加入購物車
        function addToCart(productId) {
            const product = products.find(p => p.id === productId);
            const existingItem = cart.find(item => item.id === productId);
            
            if (existingItem) {
                existingItem.quantity += 1;
            } else {
                cart.push({ ...product, quantity: 1 });
            }
            
            updateCartUI();
            showToast(`已將「${product.name}」加入購物車！`);
        }

        // 移除購物車商品
        function removeFromCart(productId) {
            cart = cart.filter(item => item.id !== productId);
            updateCartUI();
        }

        // 更新購物車介面
        function updateCartUI() {
            const cartCount = document.getElementById('cartCount');
            const cartItems = document.getElementById('cartItems');
            const totalPrice = document.getElementById('totalPrice');

            const totalCount = cart.reduce((sum, item) => sum + item.quantity, 0);
            cartCount.textContent = totalCount;

            if (cart.length === 0) {
                cartItems.innerHTML = `<p style="text-align:center; color:#999; margin-top: 2rem;">購物車目前空空如也，快去挑選年貨吧！</p>`;
                totalPrice.textContent = `NT$ 0`;
                return;
            }

            let sumPrice = 0;
            cartItems.innerHTML = cart.map(item => {
                sumPrice += item.price * item.quantity;
                return `
                    <div class="cart-item">
                        <div class="cart-item-info">
                            <h4>${item.name}</h4>
                            <p>NT$ ${item.price.toLocaleString()} x ${item.quantity}</p>
                        </div>
                        <button class="remove-btn" onclick="removeFromCart(${item.id})">刪除</button>
                    </div>
                `;
            }).join('');

            totalPrice.textContent = `NT$ ${sumPrice.toLocaleString()}`;
        }

        // 提示通知
        function showToast(text) {
            const toast = document.getElementById('toast');
            toast.textContent = text;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 2000);
        }

        // 結帳酷炫新年特效（金幣、紅包雨、鞭炮慶祝）
        function checkout() {
            if (cart.length === 0) {
                showToast("購物車是空的，無法結帳喔！");
                return;
            }
            
            toggleCart(); // 關閉購物車
            triggerNewYearFX(); // 觸發特效
            showToast("🎉 結帳成功！恭喜發財，好運龍總來！");
            cart = []; // 清空購物車
            updateCartUI();
        }

        function triggerNewYearFX() {
            const fxContainer = document.getElementById('fxContainer');
            fxContainer.style.display = 'block';
            fxContainer.innerHTML = '';

            const symbols = ['🧧', '🪙', '✨', '🏮', '🧨', '💰', '🌸'];
            const count = 50; // 特效物件數量

            for (let i = 0; i < count; i++) {
                const item = document.createElement('div');
                item.className = 'falling-item';
                item.textContent = symbols[Math.floor(Math.random() * symbols.length)];
                
                // 隨機掉落位置、大小與時間
                item.style.left = Math.random() * 100 + 'vw';
                item.style.animationDuration = (Math.random() * 2 + 2) + 's';
                item.style.animationDelay = (Math.random() * 1) + 's';
                item.style.fontSize = (Math.random() * 1.5 + 1.2) + 'rem';
                
                fxContainer.appendChild(item);
            }

            // 動畫結束後隱藏特效容器
            setTimeout(() => {
                fxContainer.style.display = 'none';
                fxContainer.innerHTML = '';
            }, 4500);
        }

        // 頁面載入初始化
        window.onload = () => {
            renderProducts();
        };
    </script>
</body>
</html>
